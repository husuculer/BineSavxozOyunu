<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binə / Binə Sovxoz 3D - Modulyar Versiya</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #1b222c;
      font-family: Arial, sans-serif;
      color: #fff;
      user-select: none;
    }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.74);
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 12.5px;
      line-height: 1.55;
      max-width: 370px;
    }
    #hud strong { color: #ffd166; }
    #statsHud {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.78);
      padding: 12px 18px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      text-align: right;
      min-width: 195px;
    }
    #wantedStars {
      font-size: 18px;
      letter-spacing: 3px;
      color: #ffd166;
      margin-bottom: 4px;
    }
    #moneyDisplay {
      font-size: 21px;
      font-weight: bold;
      color: #52b788;
    }
    #hpBarWrap {
      margin-top: 8px;
    }
    .barLabel {
      font-size: 11.5px;
      color: #ddd;
      margin-bottom: 3px;
    }
    .barBg {
      width: 100%;
      height: 7px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    #playerHpBar {
      width: 100%;
      height: 100%;
      background: #4cc9f0;
      transition: width 0.15s;
    }
    #carHpWrap { display: none; }
    #carHpBar {
      width: 100%;
      height: 100%;
      background: #52b788;
      transition: width 0.15s;
    }
    #speedBox {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.74);
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.18);
      font-size: 15px;
      font-weight: bold;
      display: none;
    }
    #prompt {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.84);
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid #ffd166;
      font-size: 14px;
      display: none;
    }
    #toast {
      position: fixed;
      top: 145px;
      right: 14px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.82);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      color: #ffd166;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>Ərazi:</strong> Binə / Binə Sovxoz (Geniş Xəritə)</div>
    <div><strong>Rejim:</strong> <span id="modeLabel">Piyada</span></div>
    <div><strong>Hərəkət:</strong> W A S D | <strong>Qaçış:</strong> Shift | <strong>Tullanma:</strong> Space</div>
    <div><strong>Vurma (NPC):</strong> Sol Klik | <strong>Kamera:</strong> Sağ Klik sürüklə</div>
    <div><strong>Maşın:</strong> F (min/düş) | <strong>Əl əyləci:</strong> Space (maşında)</div>
  </div>

  <div id="statsHud">
    <div id="wantedStars">☆☆☆☆☆</div>
    <div id="moneyDisplay">0 AZN</div>
    <div id="hpBarWrap">
      <div class="barLabel">Can: <span id="playerHpText">100%</span></div>
      <div class="barBg"><div id="playerHpBar"></div></div>
      <div id="carHpWrap">
        <div class="barLabel">Maşın: <span id="carHpText">100%</span></div>
        <div class="barBg"><div id="carHpBar"></div></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="speedBox">Sürət: <span id="speedVal">0</span> km/s</div>
  <div id="prompt">Maşına minmək üçün <strong>F</strong> bas</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { createDetailedHuman } from './character.js';
    import { NpcManager } from './npc.js';
    import { createDetailedCar } from './vehicles.js';

    // ==========================================
    // 1. SƏHNƏ VƏ İŞIQLANDIRMA
    // ==========================================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x8ecae6);
    scene.fog = new THREE.Fog(0x8ecae6, 130, 360);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 480);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.65));

    const dirLight = new THREE.DirectionalLight(0xfff3d1, 1.15);
    dirLight.position.set(100, 140, 80);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    const shadowArea = 180;
    dirLight.shadow.camera.left = -shadowArea;
    dirLight.shadow.camera.right = shadowArea;
    dirLight.shadow.camera.top = shadowArea;
    dirLight.shadow.camera.bottom = -shadowArea;
    dirLight.shadow.camera.near = 10;
    dirLight.shadow.camera.far = 380;
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(720, 720),
      new THREE.MeshStandardMaterial({ color: 0xa69b82, roughness: 0.96 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const colliders = [];

    function addBox(w, h, d, x, y, z, color, castShadow = true, receiveShadow = true, registerCollider = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        new THREE.MeshStandardMaterial({ color, roughness: 0.85 })
      );
      mesh.position.set(x, y, z);
      mesh.castShadow = castShadow;
      mesh.receiveShadow = receiveShadow;
      scene.add(mesh);
      if (registerCollider) {
        colliders.push(new THREE.Box3().setFromObject(mesh));
      }
      return mesh;
    }

    function collidesAt(pos, radius = 0.45) {
      const box = new THREE.Box3(
        new THREE.Vector3(pos.x - radius, 0.1, pos.z - radius),
        new THREE.Vector3(pos.x + radius, 2.0, pos.z + radius)
      );
      for (const cBox of colliders) {
        if (box.intersectsBox(cBox)) return true;
      }
      return false;
    }

    // ==========================================
    // 2. BÖYÜDÜLMÜŞ BİNƏ / BİNƏ SOVXOZ XƏRİTƏSİ
    // ==========================================
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x2c3035, roughness: 0.9 });
    const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x8d9299, roughness: 0.9 });
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 });

    function addRoad(x, z, w, d, horizontal = true) {
      const sidewalk = new THREE.Mesh(
        new THREE.PlaneGeometry(horizontal ? w : w + 3.4, horizontal ? d + 3.4 : d),
        sidewalkMat
      );
      sidewalk.rotation.x = -Math.PI / 2;
      sidewalk.position.set(x, 0.015, z);
      sidewalk.receiveShadow = true;
      scene.add(sidewalk);

      const road = new THREE.Mesh(new THREE.PlaneGeometry(w, d), roadMat);
      road.rotation.x = -Math.PI / 2;
      road.position.set(x, 0.03, z);
      road.receiveShadow = true;
      scene.add(road);

      if (horizontal) {
        for (let lx = x - w / 2 + 6; lx < x + w / 2 - 4; lx += 12) {
          const stripe = new THREE.Mesh(new THREE.PlaneGeometry(5, 0.25), lineMat);
          stripe.rotation.x = -Math.PI / 2;
          stripe.position.set(lx, 0.04, z);
          scene.add(stripe);
        }
      } else {
        for (let lz = z - d / 2 + 6; lz < z + d / 2 - 4; lz += 12) {
          const stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.25, 5), lineMat);
          stripe.rotation.x = -Math.PI / 2;
          stripe.position.set(x, 0.04, lz);
          scene.add(stripe);
        }
      }
    }

    const roadCoords = [-180, -120, -60, 0, 60, 120, 180];
    for (const rz of roadCoords) addRoad(0, rz, 440, rz === 0 ? 14 : 11, true);
    for (const rx of roadCoords) addRoad(rx, 0, rx === 0 ? 14 : 11, 440, false);

    const stoneColors = [0xd9cfb8, 0xcfc1a5, 0xdfd7c5, 0xc3b393, 0xb8aa8e];
    const roofColors  = [0x7a3b2e, 0x4b5259, 0x8c4a32, 0x3b4d3b];
    const gateColors  = [0x264653, 0x3d405b, 0x5c3a21, 0x2f3e46];

    function addTree(x, z) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.22, 0.3, 2.2, 7),
        new THREE.MeshStandardMaterial({ color: 0x5c4033 })
      );
      trunk.position.set(x, 1.1, z);
      trunk.castShadow = true;
      scene.add(trunk);

      const crown = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.6, 0),
        new THREE.MeshStandardMaterial({ color: 0x4a7c3a, roughness: 0.85 })
      );
      crown.position.set(x, 2.9, z);
      crown.castShadow = true;
      scene.add(crown);
    }

    function addCompoundHouse(cx, cz, lotW, lotD, seed) {
      const wallCol = stoneColors[seed % stoneColors.length];
      const roofCol = roofColors[(seed * 3) % roofColors.length];
      const gateCol = gateColors[(seed * 5) % gateColors.length];

      const houseW = lotW * 0.56;
      const houseD = lotD * 0.52;
      const houseH = 4.2 + (seed % 3) * 1.4;
      const hx = cx + ((seed % 2 === 0) ? -1.4 : 1.4);
      const hz = cz - lotD * 0.14;

      addBox(houseW, houseH, houseD, hx, houseH / 2, hz, wallCol);
      addBox(houseW + 0.6, 0.55, houseD + 0.6, hx, houseH + 0.27, hz, roofCol, true, true, false);

      const fenceH = 2.0;
      const thick = 0.45;
      const halfW = lotW / 2;
      const halfD = lotD / 2;

      addBox(lotW, fenceH, thick, cx, fenceH / 2, cz - halfD, 0xc8bc9e);
      addBox(thick, fenceH, lotD, cx - halfW, fenceH / 2, cz, 0xc8bc9e);
      addBox(thick, fenceH, lotD, cx + halfW, fenceH / 2, cz, 0xc8bc9e);

      const gateW = 3.4;
      const sideWallW = (lotW - gateW) / 2;
      addBox(sideWallW, fenceH, thick, cx - halfW + sideWallW / 2, fenceH / 2, cz + halfD, 0xc8bc9e);
      addBox(sideWallW, fenceH, thick, cx + halfW - sideWallW / 2, fenceH / 2, cz + halfD, 0xc8bc9e);
      addBox(gateW, fenceH + 0.15, 0.2, cx, (fenceH + 0.15) / 2, cz + halfD, gateCol);

      addTree(cx - halfW + 2.3, cz + halfD - 2.5);
    }

    const blockCenters = [-150, -90, -30, 30, 90, 150];
    let seed = 1;
    for (const bx of blockCenters) {
      for (const bz of blockCenters) {
        addCompoundHouse(bx - 11.5, bz - 11.5, 20, 20, seed++);
        addCompoundHouse(bx + 11.5, bz - 11.5, 20, 20, seed++);
        addCompoundHouse(bx - 11.5, bz + 11.5, 20, 20, seed++);
        addCompoundHouse(bx + 11.5, bz + 11.5, 20, 20, seed++);
      }
    }

    // ==========================================
    // 3. PUL, ULDUZ (WANTED) VƏ HİSSƏCİKLƏR
    // ==========================================
    let playerMoney = 0;
    let playerHp = 100;
    let wantedLevel = 0;
    let wantedDecayTimer = 0;

    const wantedStarsEl = document.getElementById('wantedStars');
    const moneyDisplay  = document.getElementById('moneyDisplay');
    const playerHpText  = document.getElementById('playerHpText');
    const playerHpBar   = document.getElementById('playerHpBar');
    const toastEl       = document.getElementById('toast');
    let toastTimer = null;

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.style.opacity = '1';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 1800);
    }

    function updateWantedUI() {
      wantedStarsEl.textContent = '★'.repeat(wantedLevel) + '☆'.repeat(5 - wantedLevel);
    }

    function addWanted(amount) {
      wantedLevel = Math.min(5, wantedLevel + amount);
      wantedDecayTimer = 14;
      updateWantedUI();
    }

    function damagePlayer(dmg) {
      playerHp = Math.max(0, playerHp - dmg);
      playerHpText.textContent = `${playerHp}%`;
      playerHpBar.style.width = `${playerHp}%`;
      if (playerHp <= 0) {
        playerHp = 100;
        playerHpText.textContent = '100%';
        playerHpBar.style.width = '100%';
        wantedLevel = 0;
        updateWantedUI();
        player.position.set(4, 0, 8);
        showToast('Xəstəxana/Baza: Ulduzlar sıfırlandı');
      }
    }

    const cashDrops = [];
    const cashGeo = new THREE.BoxGeometry(0.65, 0.06, 0.32);
    const cashMat = new THREE.MeshStandardMaterial({ color: 0x2d9e54, emissive: 0x134e27, roughness: 0.4 });

    function spawnCash(x, z) {
      if (Math.random() > 0.65) return;
      const amount = (Math.floor(Math.random() * 7) + 1) * 5;
      const mesh = new THREE.Mesh(cashGeo, cashMat);
      mesh.position.set(x, 0.45, z);
      mesh.castShadow = true;
      scene.add(mesh);
      cashDrops.push({ mesh, amount });
    }

    const particles = [];
    let cameraShake = 0;

    function spawnCrashEffect(pos, intensity = 1) {
      cameraShake = Math.min(0.65, 0.18 * intensity);
      const count = Math.min(24, Math.floor(8 + intensity * 6));
      for (let i = 0; i < count; i++) {
        const isSpark = i % 2 === 0;
        const pMesh = new THREE.Mesh(
          new THREE.BoxGeometry(isSpark ? 0.14 : 0.35, isSpark ? 0.14 : 0.35, isSpark ? 0.14 : 0.35),
          new THREE.MeshBasicMaterial({ color: isSpark ? 0xffb703 : 0x555555 })
        );
        pMesh.position.copy(pos);
        pMesh.position.y += 0.8;
        scene.add(pMesh);
        particles.push({
          mesh: pMesh,
          vel: new THREE.Vector3(
            (Math.random() - 0.5) * 9 * intensity,
            Math.random() * 4 + 2,
            (Math.random() - 0.5) * 9 * intensity
          ),
          life: 0.45 + Math.random() * 0.35,
          isSpark
        });
      }
    }

    // ==========================================
    // 4. OYUNÇU, NPC MODULU VƏ MAŞINLAR
    // ==========================================
    const player = createDetailedHuman({
      shirtColor: 0x1e6091,
      pantsColor: 0x1b263b,
      skinColor:  0xe0ac69,
      hairColor:  0x141414
    });
    player.position.set(4, 0, 8);
    scene.add(player);

    let playerVy = 0;

    const npcManager = new NpcManager(scene, collidesAt);
    const npcSpots = [
      [-45, 8], [-15, -8], [18, 8], [42, -8], [-8, 35], [8, -42],
      [-68, 25], [68, -28], [-52, 68], [52, -68], [-22, 52], [25, -52],
      [-85, -8], [85, 8], [-8, -85], [8, 85], [-112, 15], [112, -15],
      [-140, 65], [140, -65], [95, 125], [-95, -125]
    ];
    npcManager.populateInitial(npcSpots);

    const cars = [];
    function registerCar(car) {
      scene.add(car);
      cars.push(car);
      return car;
    }

    registerCar(createDetailedCar(12, 3.2, Math.PI / 2, { bodyColor: 0xd62828 }));
    registerCar(createDetailedCar(-24, -3.2, -Math.PI / 2, { bodyColor: 0xf77f00 }));
    registerCar(createDetailedCar(-90, 3.2, Math.PI / 2, { bodyColor: 0xe9c46a, isTraffic: true }));
    registerCar(createDetailedCar(95, -3.2, -Math.PI / 2, { bodyColor: 0x2a9d8f, isTraffic: true }));
    registerCar(createDetailedCar(3.2, -90, 0, { bodyColor: 0x457b9d, isTraffic: true }));
    registerCar(createDetailedCar(-3.2, 95, Math.PI, { bodyColor: 0xadb5bd, isTraffic: true }));
    registerCar(createDetailedCar(123.2, -60, 0, { bodyColor: 0x9b5de5, isTraffic: true }));
    registerCar(createDetailedCar(-123.2, 60, Math.PI, { bodyColor: 0xf15bb5, isTraffic: true }));

    let policeSpawnCooldown = 0;

    function spawnPoliceUnit(nearPos) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 36 + Math.random() * 14;
      const sx = Math.max(-195, Math.min(195, nearPos.x + Math.cos(angle) * dist));
      const sz = Math.max(-195, Math.min(195, nearPos.z + Math.sin(angle) * dist));

      const pCar = registerCar(createDetailedCar(sx, sz, Math.atan2(nearPos.x - sx, nearPos.z - sz), {
        isPolice: true,
        isTraffic: false
      }));
      pCar.userData.isPoliceChaser = true;

      npcManager.spawnNpc(sx + 2.2, sz, 0, true);
    }

    function applyCarDamage(car, damage, impactPoint, pushVec) {
      const d = car.userData;
      if (d.wrecked) return;

      d.hp = Math.max(0, d.hp - damage);
      if (pushVec) d.knockVel.add(pushVec);
      spawnCrashEffect(impactPoint, Math.min(2.2, damage / 18));

      const dmgRatio = 1 - d.hp / d.maxHp;
      d.hood.rotation.x = -dmgRatio * 0.28;
      d.hood.position.y = 0.94 + dmgRatio * 0.08;
      d.hoodMat.color.setHex(d.baseColor).lerp(new THREE.Color(0x222222), dmgRatio * 0.65);

      if (d.hp <= 0) {
        d.wrecked = true;
        d.speed = 0;
        d.mainMat.color.setHex(0x1f1f1f);
        d.hoodMat.color.setHex(0x111111);
        if (car === inCar) {
          showToast('Maşın sıradan çıxdı! Düşüb başqa maşına min (F).');
        }
      }
    }

    // ==========================================
    // 5. İDARƏETMƏ: SOL KLİK VURMA, SAĞ KLİK KAMERA
    // ==========================================
    const keys = {};
    let inCar = null;
    let camYaw = 0;
    let camPitch = 0.32;
    let isRightDragging = false;
    let lastMouse = { x: 0, y: 0 };

    const modeLabel = document.getElementById('modeLabel');
    const promptEl  = document.getElementById('prompt');
    const speedBox  = document.getElementById('speedBox');
    const speedVal  = document.getElementById('speedVal');
    const carHpWrap = document.getElementById('carHpWrap');
    const carHpText = document.getElementById('carHpText');
    const carHpBar  = document.getElementById('carHpBar');

    function performLeftClickAttack() {
      if (inCar) return;
      player.userData.triggerAttack();
      const forward = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));

      for (const npc of npcManager.npcs) {
        if (npc.dead) continue;
        const toNpc = npc.mesh.position.clone().sub(player.position);
        toNpc.y = 0;
        const dist = toNpc.length();
        if (dist < 2.35) {
          toNpc.normalize();
          if (forward.dot(toNpc) > 0.2) {
            addWanted(1);
            npcManager.alertNearby(npc.mesh.position, player.position, wantedLevel);
            npcManager.damageNpc(npc, 50, forward, (killedNpc, kDir) => {
              addWanted(1);
              spawnCash(killedNpc.mesh.position.x, killedNpc.mesh.position.z);
            });
          }
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (e.code === 'Space') {
        keys['space'] = true;
        if (!inCar && player.position.y <= 0.001 && playerVy === 0) {
          playerVy = 6.8; // Piyada tullanması
        }
      }

      if (k === 'f') {
        if (inCar) {
          const exitOffset = new THREE.Vector3(-2.4, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), inCar.rotation.y);
          player.position.copy(inCar.position).add(exitOffset);
          player.position.y = 0;
          playerVy = 0;
          player.visible = true;
          inCar = null;
          modeLabel.textContent = 'Piyada';
          speedBox.style.display = 'none';
          carHpWrap.style.display = 'none';
        } else {
          let nearest = null;
          let minDist = 4.4;
          for (const c of cars) {
            if (c.userData.wrecked) continue;
            const dist = player.position.distanceTo(c.position);
            if (dist < minDist) {
              minDist = dist;
              nearest = c;
            }
          }
          if (nearest) {
            inCar = nearest;
            inCar.userData.isTraffic = false;
            player.visible = false;
            modeLabel.textContent = 'Maşında';
            speedBox.style.display = 'block';
            carHpWrap.style.display = 'block';
          }
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      keys[k] = false;
      if (e.code === 'Space') keys['space'] = false;
    });

    window.addEventListener('blur', () => {
      for (const k in keys) keys[k] = false;
      isRightDragging = false;
    });

    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

    renderer.domElement.addEventListener('mousedown', (e) => {
      if (e.button === 0) {
        performLeftClickAttack();
      } else if (e.button === 2) {
        isRightDragging = true;
        lastMouse.x = e.clientX;
        lastMouse.y = e.clientY;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 2) isRightDragging = false;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isRightDragging) return;
      const dx = e.clientX - lastMouse.x;
      const dy = e.clientY - lastMouse.y;
      lastMouse.x = e.clientX;
      lastMouse.y = e.clientY;

      camYaw -= dx * 0.0065;
      camPitch = Math.max(0.08, Math.min(1.15, camPitch + dy * 0.005));
    });

    // ==========================================
    // 6. OYUN DÖVRÜ (ANIMATION LOOP)
    // ==========================================
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // Ulduzların vaxtla sönməsi
      if (wantedLevel > 0) {
        wantedDecayTimer -= dt;
        if (wantedDecayTimer <= 0) {
          wantedLevel = Math.max(0, wantedLevel - 1);
          wantedDecayTimer = 14;
          updateWantedUI();
        }
      }

      // Polis maşınlarının yaranması
      if (wantedLevel > 0) {
        policeSpawnCooldown -= dt;
        const activePoliceCars = cars.filter(c => c.userData.isPoliceChaser && !c.userData.wrecked).length;
        const maxPoliceCars = Math.min(4, wantedLevel);
        if (policeSpawnCooldown <= 0 && activePoliceCars < maxPoliceCars) {
          const targetPos = inCar ? inCar.position : player.position;
          spawnPoliceUnit(targetPos);
          policeSpawnCooldown = 4.5;
        }
      }

      const forwardInput = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0);
      const turnInput    = (keys['a'] || keys['arrowleft'] ? 1 : 0) - (keys['d'] || keys['arrowright'] ? 1 : 0);
      const isRunning    = Boolean(keys['shift']);
      const isBraking    = Boolean(keys['space']);

      // Oyunçu hərəkəti
      if (!inCar) {
        let speedRatio = 0;
        const moveSpeed = isRunning ? 10.8 : 6.0;

        if (forwardInput !== 0 || turnInput !== 0) {
          const moveDir = new THREE.Vector3(
            -Math.sin(camYaw) * forwardInput + Math.cos(camYaw) * (-turnInput),
            0,
            -Math.cos(camYaw) * forwardInput - Math.sin(camYaw) * (-turnInput)
          );
          if (moveDir.lengthSq() > 0) {
            moveDir.normalize();
            const nextPos = player.position.clone().addScaledVector(moveDir, moveSpeed * dt);
            nextPos.x = Math.max(-215, Math.min(215, nextPos.x));
            nextPos.z = Math.max(-215, Math.min(215, nextPos.z));

            if (!collidesAt(nextPos, 0.42)) {
              player.position.x = nextPos.x;
              player.position.z = nextPos.z;
              speedRatio = isRunning ? 1.0 : 0.55;
            }
            player.rotation.y = Math.atan2(moveDir.x, moveDir.z);
          }
        }

        // Cazibə qüvvəsi və tullanma
        if (player.position.y > 0 || playerVy !== 0) {
          playerVy -= 17.5 * dt;
          player.position.y += playerVy * dt;
          if (player.position.y <= 0) {
            player.position.y = 0;
            playerVy = 0;
          }
        }

        player.userData.updatePose(dt, {
          speedRatio,
          isAirborne: player.position.y > 0.02
        });

        let canEnter = false;
        for (const c of cars) {
          if (!c.userData.wrecked && player.position.distanceTo(c.position) < 4.4) {
            canEnter = true;
            break;
          }
        }
        promptEl.style.display = canEnter ? 'block' : 'none';
      } else {
        promptEl.style.display = 'none';
        const data = inCar.userData;

        if (!data.wrecked) {
          const accel = 27;
          const maxSpeed = 32;
          const naturalFriction = 14;
          const handbrakeForce = 50;

          if (isBraking) {
            data.speed -= Math.sign(data.speed) * Math.min(Math.abs(data.speed), handbrakeForce * dt);
          } else if (forwardInput > 0) {
            if (data.speed < 0) data.speed += handbrakeForce * dt;
            else data.speed += accel * dt;
          } else if (forwardInput < 0) {
            if (data.speed > 0) data.speed -= handbrakeForce * dt;
            else data.speed -= accel * 0.85 * dt;
          } else {
            data.speed -= Math.sign(data.speed) * Math.min(Math.abs(data.speed), naturalFriction * dt);
          }

          if (Math.abs(data.speed) < 0.08 && forwardInput === 0) data.speed = 0;
          data.speed = Math.max(-14, Math.min(maxSpeed, data.speed));

          if (Math.abs(data.speed) > 0.15) {
            const reverseFactor = data.speed >= 0 ? 1 : -1;
            inCar.rotation.y += turnInput * 2.25 * dt * reverseFactor;
          }
        } else {
          data.speed = 0;
        }

        const vel = new THREE.Vector3(
          Math.sin(inCar.rotation.y) * data.speed * dt,
          0,
          Math.cos(inCar.rotation.y) * data.speed * dt
        ).addScaledVector(data.knockVel, dt);
        data.knockVel.multiplyScalar(0.85);

        const nextCarPos = inCar.position.clone().add(vel);
        nextCarPos.x = Math.max(-215, Math.min(215, nextCarPos.x));
        nextCarPos.z = Math.max(-215, Math.min(215, nextCarPos.z));

        if (!collidesAt(nextCarPos, 1.38)) {
          inCar.position.copy(nextCarPos);
        } else {
          const impactSpeed = Math.abs(data.speed);
          if (impactSpeed > 7) {
            applyCarDamage(inCar, Math.round((impactSpeed - 5) * 1.8), inCar.position, null);
          }
          data.speed = -data.speed * 0.25;
        }

        player.position.copy(inCar.position);
        speedVal.textContent = Math.round(Math.abs(data.speed) * 3.6);

        const hpPct = Math.round((data.hp / data.maxHp) * 100);
        carHpText.textContent = `${hpPct}%`;
        carHpBar.style.width = `${hpPct}%`;
        carHpBar.style.background = hpPct > 50 ? '#52b788' : (hpPct > 25 ? '#f4a261' : '#e63946');
      }

      // Avtomobillər (Trafik + Polis təqibi + Miqalka + Avariya)
      const nowSec = performance.now() * 0.001;
      const targetPos = inCar ? inCar.position : player.position;

      for (let i = 0; i < cars.length; i++) {
        const c = cars[i];
        const d = c.userData;

        if (d.isPolice && d.sirenRed && d.sirenBlue) {
          const flash = Math.sin(nowSec * 14) > 0;
          d.sirenRed.material.color.setHex(flash ? 0xff1e42 : 0x550011);
          d.sirenBlue.material.color.setHex(!flash ? 0x1e90ff : 0x001a44);
        }

        if (d.hp < 55) {
          d.smokeTimer -= dt;
          if (d.smokeTimer <= 0) {
            d.smokeTimer = d.wrecked ? 0.08 : 0.22;
            const sMesh = new THREE.Mesh(
              new THREE.BoxGeometry(0.45, 0.45, 0.45),
              new THREE.MeshBasicMaterial({ color: d.wrecked ? 0x222222 : 0x777777 })
            );
            sMesh.position.copy(c.position).add(new THREE.Vector3(0, 1.3, 1.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), c.rotation.y));
            scene.add(sMesh);
            particles.push({
              mesh: sMesh,
              vel: new THREE.Vector3((Math.random() - 0.5) * 1.2, 2.5, (Math.random() - 0.5) * 1.2),
              life: 0.7,
              isSpark: false
            });
          }
        }

        if (d.isPoliceChaser && !d.wrecked && wantedLevel > 0) {
          const toTarget = targetPos.clone().sub(c.position);
          toTarget.y = 0;
          const dist = toTarget.length();
          if (dist > 3.2) {
            const desiredAngle = Math.atan2(toTarget.x, toTarget.z);
            let diffAngle = desiredAngle - c.rotation.y;
            while (diffAngle > Math.PI) diffAngle -= Math.PI * 2;
            while (diffAngle < -Math.PI) diffAngle += Math.PI * 2;
            c.rotation.y += Math.sign(diffAngle) * Math.min(Math.abs(diffAngle), 2.3 * dt);
            d.speed = Math.min(22, d.speed + 18 * dt);
          } else {
            d.speed *= 0.9;
          }

          const moveVec = new THREE.Vector3(Math.sin(c.rotation.y), 0, Math.cos(c.rotation.y))
            .multiplyScalar(d.speed * dt)
            .addScaledVector(d.knockVel, dt);
          d.knockVel.multiplyScalar(0.85);
          const nextP = c.position.clone().add(moveVec);
          if (!collidesAt(nextP, 1.4)) {
            c.position.copy(nextP);
          } else {
            c.rotation.y += 0.9;
            d.speed *= 0.5;
          }
        } else if (d.isTraffic && !d.wrecked && c !== inCar) {
          const forward = new THREE.Vector3(Math.sin(c.rotation.y), 0, Math.cos(c.rotation.y));
          const nextPos = c.position.clone().addScaledVector(forward, d.speed * dt).addScaledVector(d.knockVel, dt);
          d.knockVel.multiplyScalar(0.85);

          if (Math.abs(nextPos.x) > 205 || Math.abs(nextPos.z) > 205 || collidesAt(nextPos, 1.4)) {
            c.rotation.y += Math.PI / 2;
          } else {
            c.position.copy(nextPos);
          }
        } else if (c !== inCar && d.knockVel.lengthSq() > 0.01) {
          const nextPos = c.position.clone().addScaledVector(d.knockVel, dt);
          if (!collidesAt(nextPos, 1.4)) c.position.copy(nextPos);
          d.knockVel.multiplyScalar(0.85);
        }

        // Maşın - Maşın avariyası
        for (let j = i + 1; j < cars.length; j++) {
          const c2 = cars[j];
          const diff = c2.position.clone().sub(c.position);
          const dist = diff.length();

          if (dist < 3.4 && dist > 0.001) {
            const normal = diff.normalize();
            const overlap = 3.4 - dist;
            c.position.addScaledVector(normal, -overlap * 0.5);
            c2.position.addScaledVector(normal, overlap * 0.5);

            const v1 = new THREE.Vector3(Math.sin(c.rotation.y), 0, Math.cos(c.rotation.y)).multiplyScalar(c.userData.speed);
            const v2 = new THREE.Vector3(Math.sin(c2.rotation.y), 0, Math.cos(c2.rotation.y)).multiplyScalar(c2.userData.speed);
            const relSpeed = v1.sub(v2).length();

            if (relSpeed > 4.5) {
              const dmg = Math.round(relSpeed * 1.4);
              const midPoint = c.position.clone().add(c2.position).multiplyScalar(0.5);
              applyCarDamage(c, dmg, midPoint, normal.clone().multiplyScalar(-relSpeed * 0.65));
              applyCarDamage(c2, dmg, midPoint, normal.clone().multiplyScalar(relSpeed * 0.65));
              if (c === inCar || c2 === inCar) addWanted(1);
              c.userData.speed *= 0.3;
              c2.userData.speed *= 0.3;
            }
          }
        }
      }

      // NPC modulu yenilənməsi
      npcManager.update(dt, {
        playerPos: player.position,
        playerInCar: Boolean(inCar),
        wantedLevel,
        cars,
        onPlayerHit: (dmg) => {
          if (!inCar) damagePlayer(dmg);
        },
        onKillNpc: (killedNpc, knockDir) => {
          addWanted(1);
          spawnCash(killedNpc.mesh.position.x, killedNpc.mesh.position.z);
        }
      });

      // Pulların yığılması
      const collectorPos = inCar ? inCar.position : player.position;
      const collectRadius = inCar ? 2.6 : 1.5;

      for (let i = cashDrops.length - 1; i >= 0; i--) {
        const drop = cashDrops[i];
        drop.mesh.rotation.y += dt * 3.0;
        drop.mesh.position.y = 0.45 + Math.sin(nowSec * 5) * 0.08;

        if (collectorPos.distanceTo(drop.mesh.position) < collectRadius) {
          playerMoney += drop.amount;
          moneyDisplay.textContent = `${playerMoney} AZN`;
          showToast(`+${drop.amount} AZN götürüldü`);
          scene.remove(drop.mesh);
          cashDrops.splice(i, 1);
        }
      }

      // Hissəciklər
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
          continue;
        }
        if (p.isSpark) p.vel.y -= 18 * dt;
        p.mesh.position.addScaledVector(p.vel, dt);
        p.mesh.scale.multiplyScalar(0.95);
      }

      // Kamera
      let shakeVec = new THREE.Vector3();
      if (cameraShake > 0) {
        cameraShake = Math.max(0, cameraShake - dt * 1.8);
        shakeVec.set(
          (Math.random() - 0.5) * cameraShake,
          (Math.random() - 0.5) * cameraShake,
          (Math.random() - 0.5) * cameraShake
        );
      }

      if (!inCar) {
        const dist = 6.4;
        const cx = player.position.x + Math.sin(camYaw) * Math.cos(camPitch) * dist;
        const cy = player.position.y + Math.sin(camPitch) * dist + 1.4;
        const cz = player.position.z + Math.cos(camYaw) * Math.cos(camPitch) * dist;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.22).add(shakeVec);
        camera.lookAt(player.position.x, player.position.y + 1.35, player.position.z);
      } else {
        const camDist = 9.2;
        const targetYaw = camYaw + inCar.rotation.y + Math.PI;
        const cx = inCar.position.x + Math.sin(targetYaw) * Math.cos(camPitch) * camDist;
        const cy = inCar.position.y + Math.sin(camPitch) * camDist + 1.8;
        const cz = inCar.position.z + Math.cos(targetYaw) * Math.cos(camPitch) * camDist;
        camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.16).add(shakeVec);
        camera.lookAt(inCar.position.x, inCar.position.y + 1.3, inCar.position.z);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
